name: Vibrion sentinel watch

# Watches NCBI SRA for new Vibrio cholerae accessions, runs the lite
# per-sample pipeline on each (GitHub-hosted runners, balanced tier),
# and records processed accessions in state/seen_accessions.txt.
#
# Setup order: run build-references.yml once first (publishes the
# sentinel-refs-v1 release asset this workflow downloads).

on:
  schedule:
    - cron: "17 */6 * * *"  # every 6 hours
  workflow_dispatch:
    inputs:
      force_accessions:
        description: "Comma-separated run accessions to process directly (skips SRA search; for testing/manual runs)"
        required: false
        default: ""
      force_priority:
        description: "Priority tag applied to force_accessions (set 'haiti' to also archive raw reads to R2)"
        required: false
        default: "global"
        type: choice
        options: ["global", "haiti"]

permissions:
  contents: write

concurrency:
  group: sentinel-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.emit.outputs.matrix }}
      new_count: ${{ steps.emit.outputs.new_count }}
    steps:
      - uses: actions/checkout@v4

      - name: Find new accessions
        id: emit
        run: |
          if [ -n "${{ inputs.force_accessions }}" ]; then
            echo "Forced accessions: ${{ inputs.force_accessions }}"
            python3 - "${{ inputs.force_accessions }}" "${{ inputs.force_priority }}" <<'EOF'
          import json, sys
          accs = [a.strip() for a in sys.argv[1].split(",") if a.strip()]
          priority = sys.argv[2] or "global"
          json.dump({"include": [{"accession": a, "priority": priority} for a in accs]}, open("/tmp/matrix.json", "w"))
          EOF
          else
            python3 scripts/watch_sra.py \
              --state state/seen_accessions.txt \
              --days 7 --max-new 10 \
              --out-matrix /tmp/matrix.json
          fi
          COUNT=$(python3 -c "import json; print(len(json.load(open('/tmp/matrix.json'))['include']))")
          echo "matrix=$(cat /tmp/matrix.json)" >> "$GITHUB_OUTPUT"
          echo "new_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "New accessions: $COUNT"

  process:
    needs: watch
    if: needs.watch.outputs.new_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.watch.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Download reference bundle
        run: |
          gh release download sentinel-refs-v1 \
            --pattern "sentinel-refs-v1.tar.gz" --dir /tmp
          mkdir -p refs && tar -xzf /tmp/sentinel-refs-v1.tar.gz -C refs
          ls refs/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: mamba-org/setup-micromamba@v2
        with:
          micromamba-version: "latest"
          environment-file: workflow/envs/sentinel_lite.yaml
          cache-environment: true
          environment-name: sentinel-lite

      - name: Download reads (ENA, fallback SRA Toolkit)
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          ROOT="$PWD"
          ACC="${{ matrix.accession }}"
          mkdir -p "work/${ACC}"
          META=$(curl -s "https://www.ebi.ac.uk/ena/portal/api/filereport?accession=${ACC}&result=read_run&fields=run_accession,fastq_ftp,library_layout&format=json")
          LAYOUT=$(ACC="$ACC" META="$META" python3 - <<'EOF'
          import json, os
          d = json.loads(os.environ["META"])
          if not d:
              print("MISSING")
          else:
              r = d[0]
              print(r.get("library_layout", "PAIRED"))
              with open(f"work/{os.environ['ACC']}/ena.json", "w") as f:
                  json.dump(r, f)
          EOF
          )
          if [ "$LAYOUT" = "MISSING" ]; then
            echo "No ENA record for $ACC — trying SRA Toolkit"
            cd "work/${ACC}"
            fasterq-dump "$ACC" --threads 2 --progress
            ls ${ACC}*.fastq | head
            gzip -1 ${ACC}*.fastq
            if [ -f "${ACC}_2.fastq.gz" ]; then PAIRED=true; else PAIRED=false; fi
            R1="$(ls ${ACC}_1.fastq.gz 2>/dev/null || ls ${ACC}.fastq.gz)"
            R2="$(ls ${ACC}_2.fastq.gz 2>/dev/null || echo '')"
            cd "$ROOT"
          else
            PAIRED="true"; [ "$LAYOUT" = "SINGLE" ] && PAIRED="false"
            URLS=$(python3 -c "import json; print(json.load(open('work/${ACC}/ena.json'))['fastq_ftp'])")
            i=1
            for u in $(echo "$URLS" | tr ';' ' '); do
              curl -sL --retry 3 -o "work/${ACC}/reads_${i}.fastq.gz" "https://${u}"
              i=$((i+1))
            done
            R1="work/${ACC}/reads_1.fastq.gz"
            R2="work/${ACC}/reads_2.fastq.gz"
            [ "$PAIRED" = "false" ] && R2=""
          fi
          # resolve to absolute paths for snakemake
          R1="$(cd "$(dirname "$R1")" && pwd)/$(basename "$R1")"
          [ -n "$R2" ] && R2="$(cd "$(dirname "$R2")" && pwd)/$(basename "$R2")"
          python3 - "$ACC" "$PAIRED" "$R1" "$R2" <<'EOF'
          import sys
          acc, paired, r1, r2 = sys.argv[1], sys.argv[2] == "true", sys.argv[3], sys.argv[4]
          cfg = {
              "accession": acc,
              "paired": paired,
              "reads_r1": r1,
              "reads_r2": r2,
              "refdir": "refs",
              "outdir": f"results/{acc}",
              "threads": 2,
          }
          with open(f"work/{acc}/config.yaml", "w") as f:
              for k, v in cfg.items():
                  f.write(f"{k}: {str(v).lower() if isinstance(v, bool) else repr(v) if isinstance(v, str) else v}\n")
          print(open(f"work/{acc}/config.yaml").read())
          EOF

      - name: Archive raw reads to R2 (Haiti-tier only)
        if: matrix.priority == 'haiti'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${R2_BUCKET:-}" ]; then
            echo "R2_BUCKET secret not set — skipping raw-read archive"
            exit 0
          fi
          ACC="${{ matrix.accession }}"
          for f in "work/${ACC}"/*.fastq.gz; do
            [ -e "$f" ] || continue
            aws s3 cp "$f" "s3://${R2_BUCKET}/raw/haiti/${ACC}/$(basename "$f")" \
              --endpoint-url "$AWS_ENDPOINT_URL"
          done

      - name: Run lite pipeline
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          ACC="${{ matrix.accession }}"
          micromamba run -n sentinel-lite snakemake \
            -s workflow/sentinel_lite/Snakefile \
            --configfile "work/${ACC}/config.yaml" \
            --cores 2 --printshellcmds
          echo "=== report ==="
          cat "results/${ACC}/report.json"
          # QC fail is a data verdict, not a pipeline error: keep the job green
          # (artifacts stay inspectable) but surface it in the run summary.
          python3 - "$ACC" <<'EOF'
          import json, sys
          acc = sys.argv[1]
          qc = json.load(open(f"results/{acc}/report.json"))["qc"]
          if qc["status"] != "pass":
              print(f"::warning title=QC fail {acc}::" + "; ".join(qc["reasons"]))
          EOF

      - name: Push report to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY not set -- skipping metrics push"
            exit 0
          fi
          python3 - "${{ matrix.accession }}" "${{ matrix.priority }}" <<'EOF' > /tmp/sentinel_row.json
          import json, sys
          acc, priority = sys.argv[1], sys.argv[2] or None
          with open(f"results/{acc}/report.json") as f:
              r = json.load(f)
          row = {
              "accession": r["accession"],
              "priority": priority,
              "pipeline_version": r.get("version"),
              "reference": r.get("reference"),
              "reads_raw": r.get("reads", {}).get("raw"),
              "reads_qc_passed": r.get("reads", {}).get("qc_passed"),
              "reads_vibrio_kept": r.get("reads", {}).get("vibrio_kept"),
              "kraken_db": r.get("classification", {}).get("kraken_db"),
              "v_cholerae_reads": r.get("classification", {}).get("v_cholerae_reads"),
              "v_cholerae_fraction": r.get("classification", {}).get("v_cholerae_fraction"),
              "mapped_reads": r.get("mapping", {}).get("mapped_reads"),
              "mean_depth": r.get("mapping", {}).get("mean_depth"),
              "breadth_pct": r.get("mapping", {}).get("breadth_pct"),
              "snps_vs_7pet": r.get("variants", {}).get("snps_vs_7pet"),
              "consensus_length": r.get("consensus_length"),
              "consensus_called_pct": r.get("consensus_called_pct"),
              "qc_status": r.get("qc", {}).get("status"),
              "qc_reasons": r.get("qc", {}).get("reasons"),
              "surveillance_loci": r.get("surveillance_loci"),
              "report": r,
          }
          json.dump(row, sys.stdout)
          EOF
          curl -sS --fail-with-body -X POST \
            "${SUPABASE_URL}/rest/v1/sentinel_runs" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            --data @/tmp/sentinel_row.json

      - name: Archive consensus to R2 (QC-pass only)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${R2_BUCKET:-}" ]; then
            echo "R2_BUCKET secret not set -- skipping consensus archive"
            exit 0
          fi
          ACC="${{ matrix.accession }}"
          # QC-fail consensus is mostly N (low-depth positions are masked) and
          # must never reach a cohort alignment -- gate on the report's verdict.
          QC=$(python3 -c "import json;print(json.load(open('results/${ACC}/report.json'))['qc']['status'])")
          if [ "$QC" != "pass" ]; then
            echo "qc status '$QC' -- not archiving consensus for $ACC"
            exit 0
          fi
          gzip -c "results/${ACC}/06_variants/consensus.fasta" > "/tmp/${ACC}.fasta.gz"
          aws s3 cp "/tmp/${ACC}.fasta.gz" \
            "s3://${R2_BUCKET}/consensus/${ACC}.fasta.gz" \
            --endpoint-url "$AWS_ENDPOINT_URL"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-${{ matrix.accession }}
          path: |
            results/${{ matrix.accession }}/report.json
            results/${{ matrix.accession }}/06_variants/consensus.fasta
            results/${{ matrix.accession }}/05_loci/loci_coverage.txt
          if-no-files-found: error
          retention-days: 90

  record:
    needs: [watch, process]
    if: always() && needs.watch.outputs.new_count != '0' && needs.process.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record processed accessions
        run: |
          git config user.name "vibrion-sentinel-bot"
          git config user.email "vibrion-sentinel-bot@users.noreply.github.com"
          git pull --rebase --autostash || true
          python3 - <<'EOF'
          import json, os
          matrix = json.loads(os.environ["MATRIX_JSON"])
          seen = set()
          try:
              with open("state/seen_accessions.txt") as f:
                  seen = {l.strip() for l in f if l.strip() and not l.startswith("#")}
          except FileNotFoundError:
              pass
          new = [i["accession"] for i in matrix["include"] if i["accession"] not in seen]
          with open("state/seen_accessions.txt", "a") as f:
              for acc in new:
                  f.write(acc + "\n")
          print(f"recorded {len(new)} accessions")
          EOF
          git add state/seen_accessions.txt
          git diff --cached --quiet || git commit -m "sentinel: processed accessions $(date -u +%F)"
          git push
        env:
          MATRIX_JSON: ${{ needs.watch.outputs.matrix }}
