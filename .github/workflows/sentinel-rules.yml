name: Sentinel recurrence/cluster rules

# Evaluates the R1 (recurrence after quiet years) and R2 (spatiotemporal
# cluster) rules over the sentinel_runs table, records firings in
# sentinel_alerts (deduplicated), and pushes ntfy notifications.
#
# The rules themselves live in scripts/watch_rules.py (pure functions, unit
# tested). This workflow is only scheduling + I/O. Run it after the
# sentinel-watch workflow has had a chance to ingest new accessions;
# daily is plenty -- the rules look back over years of history.

on:
  schedule:
    - cron: "23 7 * * *"  # daily ~07:23 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Evaluate and print findings without writing alerts or notifying"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      quiet_years:
        description: "Quiet-period threshold for R1 (years)"
        required: false
        default: "2"

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Screen for R2 cluster members (no alerting)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY not set -- skipping rules evaluation"
            echo "SKIP_RULES=1" >> "$GITHUB_ENV"
            exit 0
          fi
          python3 scripts/watch_rules.py \
            --quiet-years "${{ inputs.quiet_years || '2' }}" \
            --cluster-members-out /tmp/cluster_members.txt

      - name: Fetch consensuses for cluster members (R2)
        if: env.SKIP_RULES != '1'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/consensus
          if [ ! -s /tmp/cluster_members.txt ]; then
            echo "no cluster members -- nothing to fetch"
            exit 0
          fi
          if [ -z "${R2_BUCKET:-}" ]; then
            echo "R2_BUCKET not set -- Phase 4 confirmation skipped (proxy only)"
            exit 0
          fi
          while read -r acc; do
            [ -n "$acc" ] || continue
            # Provisional consensuses live under a separate prefix (kept out
            # of the cohort phylogeny); try the main prefix first.
            aws s3 cp "s3://${R2_BUCKET}/consensus/${acc}.fasta.gz" \
              "/tmp/consensus/${acc}.fasta.gz" \
              --endpoint-url "$AWS_ENDPOINT_URL" 2>/dev/null \
            || aws s3 cp "s3://${R2_BUCKET}/consensus-provisional/${acc}.fasta.gz" \
              "/tmp/consensus/${acc}.fasta.gz" \
              --endpoint-url "$AWS_ENDPOINT_URL" 2>/dev/null \
            || echo "::warning::no R2 consensus for ${acc}"
          done < /tmp/cluster_members.txt
          ls /tmp/consensus | wc -l

      - name: Evaluate recurrence/cluster rules
        if: env.SKIP_RULES != '1'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOPIC: ${{ secrets.NTFY_SENTINEL_TOPIC }}
        run: |
          set -euo pipefail
          ARGS=(--quiet-years "${{ inputs.quiet_years || '2' }}")
          if [ -d /tmp/consensus ] && [ "$(ls -A /tmp/consensus 2>/dev/null)" ]; then
            ARGS+=(--consensus-dir /tmp/consensus)
          fi
          if [ "${{ inputs.dry_run || 'false' }}" = "true" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARGS+=(--dry-run)
          fi
          # Scheduled runs always act (write alerts + notify); manual runs
          # default to dry-run unless explicitly disabled.
          python3 scripts/watch_rules.py "${ARGS[@]}"
