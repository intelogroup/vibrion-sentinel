name: Build sentinel reference bundle

# One-time (re-run when references change): builds the Haiti kraken2 DB,
# serogroup DB and 7PET reference + bwa-mem2 index (surveillance loci BED is
# curated in workflow/sentinel_lite/, not built here),
# then publishes them as a GitHub Release asset consumed by sentinel-watch.
# NOTE: bwa-mem2 index format differs from bwa -- rebuild the release after
# any mapper change; old bundles' .bwt/.sa files will NOT work.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          micromamba-version: "latest"
          environment-file: workflow/envs/sentinel_lite.yaml
          cache-environment: true
          environment-name: sentinel-lite

      - name: Build reference bundle
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir -p refs_build && cd refs_build

          # Retry helper: NCBI EUtils is flaky (transient empty responses,
          # rate-limit 429s). A single bare curl used to kill the whole build
          # on the first blip (run 37672605763 died on the PLE2 fetch). Never
          # fail fast on a fetch: retry with backoff, validate header +
          # minimum length, and only then accept the file.
          efetch() { # efetch <url> <out> [min_seq_len]
            local url="$1" out="$2" min_len="${3:-0}" attempt=1 seqlen
            while [ "$attempt" -le 5 ]; do
              if curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
                        --retry-max-time 120 --max-time 180 \
                        "$url" -o "$out.tmp"; then
                if [ "$(head -c 1 "$out.tmp")" = ">" ]; then
                  seqlen=$(grep -v '^>' "$out.tmp" | tr -d '\n\r ' | wc -c || true)
                  if [ "$seqlen" -ge "$min_len" ]; then
                    mv "$out.tmp" "$out"
                    echo "  ok: $out (${seqlen} bp, attempt ${attempt})"
                    sleep 1  # stay polite to NCBI (<=3 req/sec)
                    return 0
                  fi
                  echo "  too short (${seqlen} < ${min_len} bp): $out (attempt ${attempt})" >&2
                else
                  echo "  not FASTA: $out (attempt ${attempt})" >&2
                fi
              else
                echo "  curl failed: $out (attempt ${attempt})" >&2
              fi
              rm -f "$out.tmp"
              attempt=$((attempt + 1))
              sleep 5
            done
            echo "ERROR: giving up on $out after 5 attempts" >&2
            return 1
          }

          EUTILS="https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=nucleotide"

          echo "▶ Fetching 2010EL-1786 (fasta)..."
          # min lengths = 90% of the live record (CP003069.1: 3031375 bp,
          # CP003070.1: 1046365 bp, measured 2026-10-07).
          efetch "${EUTILS}&id=CP003069.1&rettype=fasta&retmode=text" chr1.fa 2728237
          efetch "${EUTILS}&id=CP003070.1&rettype=fasta&retmode=text" chr2.fa 941728
          cat chr1.fa chr2.fa > 2010EL-1786.fasta

          echo "▶ Fetching Haiti 2022 resurgence reference..."
          efetch "${EUTILS}&id=OQ860440.1&rettype=fasta&retmode=text" Haiti_2022_Resurgence.fasta

          echo "▶ Mobile-element reference sequences (Phase 5B.3/5B.4 screens)..."
          mkdir -p mobile_refs
          # PLE islands: full element genomic sequences (canonical references).
          # min lengths = 90% of MANIFEST.tsv length_bp.
          efetch "${EUTILS}&id=PQ783903.1&rettype=fasta&retmode=text" mobile_refs/PLE11.fasta 17288   # Mathur et al., Nature 2026 (Rta ~80 aa verified)
          efetch "${EUTILS}&id=KC152960.1&rettype=fasta&retmode=text" mobile_refs/PLE1.fasta 16271    # Seed lab canonical PLE1 (Seed et al., Nature 2013)
          efetch "${EUTILS}&id=KC152961.1&rettype=fasta&retmode=text" mobile_refs/PLE2.fasta 16569    # Seed lab canonical PLE2 (Seed et al., Nature 2013)
          # Defense systems: operon ranges from V. cholerae A1552 (CP028894.1),
          # locus-tag mapping per Adams et al., Nat Microbiol 2025 (Suppl. Tables 4/6/7).
          # GenBank annotates these as hypothetical proteins; the system
          # assignments below are the paper's, verified against the record.
          efetch "${EUTILS}&id=CP028894.1&seq_start=1336122&seq_stop=1337812&rettype=fasta&retmode=text" mobile_refs/WonAB.fasta 1521    # A1552VC_01233-34 (421+140 aa)
          efetch "${EUTILS}&id=CP028894.1&seq_start=268546&seq_stop=272823&rettype=fasta&retmode=text" mobile_refs/GrwAB.fasta 3850     # A1552VC_00274-75 (603+821 aa)
          efetch "${EUTILS}&id=CP028894.1&seq_start=273189&seq_stop=275145&rettype=fasta&retmode=text" mobile_refs/VcSduA.fasta 1761    # A1552VC_00276 (651 aa)
          # Provenance manifest: accession, coords, length, source, verification.
          cat > mobile_refs/MANIFEST.tsv <<'EOF'
          file	accession	coords	length_bp	source_paper	verification
          PLE11.fasta	PQ783903.1	full record	19209	Mathur et al., Nature 2026 (PMID 41813903)	Rta 80 aa confirmed in GenBank CDS annotation; matches paper's ~80-aa Rta
          PLE1.fasta	KC152960.1	full record	18079	Seed et al., Nature 2013 (PLE discovery)	Canonical Seed-lab PLE1 (strain KS393); record cites the 2013 Nature paper
          PLE2.fasta	KC152961.1	full record	18410	Seed et al., Nature 2013 (PLE discovery)	Canonical Seed-lab PLE2 (strain KS229); same deposit series as PLE1
          WonAB.fasta	CP028894.1	1336122-1337812	1691	Adams et al., Nat Microbiol 2025 (Suppl. Table 4)	Locus tags A1552VC_01233-34 (421+140 aa); 140-aa WonB consistent with paper's short-lived toxin
          GrwAB.fasta	CP028894.1	268546-272823	4278	Adams et al., Nat Microbiol 2025 (Suppl. Table 6)	Locus tags A1552VC_00274-75 (603+821 aa), adjacent operon; GmrSD-like Type IV REase
          VcSduA.fasta	CP028894.1	273189-275145	1957	Adams et al., Nat Microbiol 2025 (Suppl. Table 7)	Locus tag A1552VC_00276 (651 aa); Shedu-family nuclease
          EOF

          echo "▶ bwa-mem2 index..."
          bwa-mem2 index 2010EL-1786.fasta

          echo "▶ Haiti custom kraken2 DB..."
          bash ../scripts/build_haiti_kraken_db.sh kraken2_haiti_custom 2

          echo "▶ Serogroup kraken2 DB (O1 seed; extend with O139 refs as available)..."
          mkdir -p kraken2_serogroup
          mkdir -p kraken2_serogroup/taxonomy
          # HTTPS: kraken2-build --download-taxonomy uses rsync, blocked on CI runners
          curl -sL "https://ftp.ncbi.nlm.nih.gov/pub/taxonomy/taxdump.tar.gz" -o taxdump.tar.gz
          tar -xzf taxdump.tar.gz -C kraken2_serogroup/taxonomy
          # copy first: the taxid tag must not leak into the packaged fasta
          # (bwa rebuilds its index when the fasta is newer, changing @SQ names)
          cp 2010EL-1786.fasta serogroup_src.fasta
          sed -i -E 's/^(>\S+)/\1|kraken:taxid|666/' serogroup_src.fasta
          kraken2-build --add-to-library serogroup_src.fasta --db kraken2_serogroup
          kraken2-build --build --db kraken2_serogroup --threads 2

          echo "▶ Packaging..."
          tar -czf ../sentinel-refs-v1.tar.gz \
            2010EL-1786.fasta 2010EL-1786.fasta.bwt 2010EL-1786.fasta.pac \
            2010EL-1786.fasta.ann 2010EL-1786.fasta.amb 2010EL-1786.fasta.sa \
            Haiti_2022_Resurgence.fasta \
            mobile_refs \
            kraken2_haiti_custom kraken2_serogroup
          du -sh ../sentinel-refs-v1.tar.gz

      - name: Publish release asset
        run: |
          gh release delete sentinel-refs-v1 --yes 2>/dev/null || true
          gh release create sentinel-refs-v1 sentinel-refs-v1.tar.gz \
            --title "Sentinel reference bundle v1" \
            --notes "Haiti kraken2 DB, serogroup DB, 2010EL-1786 + BWA index. Built by build-references.yml."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
