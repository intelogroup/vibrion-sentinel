# Test Configuration - Small Sample DRR296286
# Run from project root: snakemake --configfile workflow/test_config.yaml --cores 4

# Input/Output Paths
samples_dir: "data/raw_reads"
output_dir: "data/pipeline_output"
reference_dir: "data/references"
global_references_dir: "data/global_references"
reference_library_dir: "data/reference_library"

global_lineages:
  [
    "haiti-2010",
    "haiti-2022",
    "yemen-2017",
    "india-wave3",
    "bangladesh-xdr-2023",
    "peru-wasa",
    "novc-decoy",
  ]

# NOVC Environmental References
novc_references_enabled: True
novc_reference_dir: "data/reference_library/novc_environmental"
novc_reference_strains:
  - NOVC13
  - NOVC03
  - NOVC05
  - RFB16
  - NOVC07

# Kraken2 Databases
kraken_db: "data/kraken2_haiti_custom"
kraken_broad_db: "data/kraken2_standard_8gb"
serogroup_db: "data/kraken2_serogroup"

# MMseqs2 Configuration
mmseqs_db: "data/mmseqs_db/swissprot"
mmseqs_min_seq_id: 0.8
mmseqs_mapping_rescue_enabled: True

# Alignment Configuration
aligner_type: "bwa"
snpeff_db: "Vibrio_cholerae_o1_str_2010el_1786"

# Pipeline Mode
pipeline_mode: "LABORATORY_FULL"

# API Configuration
nvidia_api_key: "nvapi-XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
evo_api_url: "https://health.api.nvidia.com/v1/biology/arc/evo2-40b/generate"

# Evolution Surveillance
evo2:
  sentinel_ref: "data/references/2010EL-1786.fasta"
  outbreak_ref: "data/references/Haiti_2022_Resurgence.fasta"

# Triage Configuration
triage:
  model_cache_dir: "data/models/triage"
  sourmash_ksize: 31
  sourmash_scaled: 1000
  sourmash_threshold: 0.999
  hyena_model: "LongSafari/hyenadna-tiny-1k-seqlen-hf"
  hyena_threshold: 15.0
  hyena_window_size: 500
  hyena_use_real_model: true
  device: "mps"

# ============================================================================
# MEMORY MANAGEMENT SYSTEM (NEW - Testing adaptive tier selection)
# ============================================================================
memory_management:
  enabled: True
  auto_detect: True          # Automatically detect tier based on available RAM
  force_tier: null           # Override for testing (uncomment to force): "BUNKER"
  
  tiers:
    FULL:
      available_gb_min: 10
      description: "All features enabled"
      kraken_db: "data/kraken2_standard_8gb"
      max_threads: 4
      features:
        - kraken2_full
        - mmseqs2_rescue
        - mafft_full_alignment
        - evo2_pathogenicity
        - phylogenetic_inference
      memory_settings:
        kraken2_threads: 4
        spades_kmers: "21,33,55,77"
        mafft_strategy: "full"
        mafft_max_refs: null
    
    BALANCED:
      available_gb_min: 6
      description: "Optimized for typical laptops"
      kraken_db: "data/kraken2_haiti_custom"
      max_threads: 3
      features:
        - kraken2_haiti
        - mmseqs2_rescue
        - mafft_fast_alignment
        - evo2_pathogenicity
      memory_settings:
        kraken2_threads: 3
        spades_kmers: "21,33,55"
        mafft_strategy: "fast"
        mafft_max_refs: 50
    
    BUNKER:
      available_gb_min: 3
      description: "Minimal footprint"
      kraken_db: "data/kraken2_haiti_custom"
      max_threads: 2
      features:
        - kraken2_haiti
        - mmseqs2_rescue
      memory_settings:
        kraken2_threads: 2
        spades_kmers: "21,33"
        mafft_strategy: "skip"
        mafft_max_refs: 0
    
    EMERGENCY:
      available_gb_min: 0
      description: "Core analysis only"
      kraken_db: "data/kraken2_haiti_custom"
      max_threads: 1
      features:
        - kraken2_haiti
      memory_settings:
        kraken2_threads: 1
        spades_assembly: false
        mafft_strategy: "skip"
  
  monitoring:
    enabled: True
    check_interval_sec: 30
    log_file: "logs/memory_profile.log"
    alert_threshold_percent: 85
  
  cleanup:
    enable_suggestions: True
    auto_cleanup: False

# General Settings
hostile_index: "human-t2t-hla-argos985"
vibrio_taxid: 662
threads: 4
memory_mb: 8000
samples:
  ["DRR296286"]  # Small 6GB paired-end sample

# MongoDB
mongodb_url: "${MONGODB_URL}"

# Supabase
supabase_url: "${SUPABASE_URL}"
supabase_key: "${SUPABASE_KEY}"

# Analysis Parameters
threads: 4
memory_mb: 8000

# Single test sample
samples:
  - SRR22265437
