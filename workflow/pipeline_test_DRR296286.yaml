# AMR Detection
amr_db: "data/amr_db"

# Phage Detection
phage_sentinels:
  - "CTX"
  - "ICP1"

# Samples
samples:
  - "DRR296286"

# Run Parameters
batch_name: "DRR296286_test"
run_date: "2026-02-01"
description: "DRR296286 sample analysis"
