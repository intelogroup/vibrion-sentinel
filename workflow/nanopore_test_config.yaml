# Nanopore Test Configuration
samples_dir: "data/raw_reads"
output_dir: "data/pipeline_output"
reference_dir: "data/references"
global_references_dir: "data/global_references"

# Databases
kraken_db: "data/kraken2_haiti_custom"
kraken_broad_db: "data/kraken2_standard_8gb"
serogroup_db: "data/kraken2_serogroup"
mmseqs_db: "data/mmseqs_db/swissprot"

# Nanopore-specific settings
aligner_type: "minimap2"  # Critical for nanopore long reads
mmseqs_min_seq_id: 0.8
mmseqs_mapping_rescue_enabled: true
mapping_rescue_confidence_threshold: 0.6
mapping_rescue_max_reads: 5000

# Configuration
hostile_index: "human-t2t-hla-argos985"
vibrio_taxid: 662
threads: 4
memory_mb: 8000
pipeline_mode: "LABORATORY_FULL"

# AI API
nvidia_api_key: "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"
evo_api_url: "https://health.api.nvidia.com/v1/biology/arc/evo2-40b/generate"

# Triage settings
triage:
  model_cache_dir: "data/models/triage"
  sourmash_ksize: 31
  sourmash_scaled: 1000
  sourmash_threshold: 0.999
  sourmash_min_divergent_kmers: 10
  hyena_model: "LongSafari/hyenadna-tiny-1k-seqlen-hf"
  hyena_threshold: 15.0
  hyena_window_size: 500
  hyena_use_real_model: true
  hyenadna_tier2_model: "LongSafari/hyenadna-tiny-1k-seqlen-hf"
  hyenadna_tier2_loci: ["ctxB", "wbeT", "tcpA", "gyrA", "parE", "scrABC", "katB", "ahpC", "hapR"]
  hyenadna_tier2_threshold: 2.0
  hyenadna_tier2_overlap_threshold: 0.5
  device: "mps"

# Test sample - nanopore subset
samples: ["SRR27991387_subset"]
