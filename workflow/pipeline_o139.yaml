# O139 Bangladesh samples
samples_dir: "data/raw_reads/O139"
output_dir: "data/pipeline_output"
reference_dir: "data/references"
global_references_dir: "data/global_references"

# Databases
kraken_db: "data/kraken2_standard_8gb"
serogroup_db: "data/kraken2_serogroup"
mmseqs_db: "data/mmseqs_db/swissprot"

# Configuration
hostile_index: "human-t2t-hla-argos985"
vibrio_taxid: 662
threads: 4
memory_mb: 8000
aligner_type: "bwa"
pipeline_mode: "LABORATORY_FULL"

# AI API
# SECURITY: Load API key from environment variable NVIDIA_API_KEY
# nvidia_api_key: "<set via env var>"
evo_api_url: "https://health.api.nvidia.com/v1/biology/arc/evo2-40b/generate"

# Triage
triage:
  model_cache_dir: "data/models/triage"
  sourmash_ksize: 31
  sourmash_scaled: 1000
  sourmash_threshold: 0.999
  sourmash_min_divergent_kmers: 10
  hyena_model: "LongSafari/hyenadna-tiny-1k-seqlen-hf"
  hyena_threshold: 0.3
  hyena_window_size: 500
  hyena_use_real_model: true
  caduceus_model: "kuleshov-group/caduceus-ph_seqlen-1k_d_model-118_n_layer-4_lr-8e-3"
  caduceus_loci: ["ctxB", "wbeT", "tcpA"]
  caduceus_threshold: 0.5
  caduceus_overlap_threshold: 0.5
  caduceus_use_real_model: false
  device: "mps"

samples: ["ERR018121", "ERR018118"]