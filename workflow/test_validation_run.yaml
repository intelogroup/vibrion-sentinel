# Validation Test Run Configuration
# Using real samples from the archive to generate validation data

samples_dir: "data/raw_reads"
output_dir: "data/pipeline_output/validation_test"
reference_dir: "data/references"
global_references_dir: "data/global_references"
reference_library_dir: "data/reference_library"

# Databases
kraken_db: "data/kraken2_haiti_custom"
kraken_broad_db: "data/kraken2_standard_8gb"
serogroup_db: "data/kraken2_serogroup"
mmseqs_db: "data/mmseqs_db/swissprot"

# Test samples
# SRR22265446: 2021 Environmental isolate (Haiti inter-epidemic period)
# SRR27991387_subset: Nanopore long-read test
samples: 
  - "SRR22265446"
  - "SRR27991387_subset"

# Triage settings
triage:
  model_cache_dir: "data/models/triage"
  sourmash_ksize: 31
  sourmash_scaled: 1000
  sourmash_threshold: 0.999
  sourmash_min_divergent_kmers: 10
  hyena_model: "LongSafari/hyenadna-tiny-1k-seqlen-hf"
  hyena_threshold: 15.0
  hyena_window_size: 500
  hyena_use_real_model: true
  device: "mps"

# Alignment Configuration
aligner_type: "bwa"  # For Illumina reads

# Configuration
hostile_index: "human-t2t-hla-argos985"
vibrio_taxid: 662
threads: 4
memory_mb: 8000
pipeline_mode: "LABORATORY_FULL"

# AI API
nvidia_api_key: ""  # Set via: --config nvidia_api_key=$NVIDIA_API_KEY
evo_api_url: "https://health.api.nvidia.com/v1/biology/arc/evo2-40b/generate"

# Variant Calling & Heterogeneity Thresholds
variant_thresholds:
  clonal_af: 0.9
  minor_af: 0.1
  hetero_min_depth: 20
  iupac_min_af: 0.2

# Enable NOVC references for environmental detection
novc_references_enabled: True
novc_reference_dir: data/reference_library/novc_environmental

# Evolution Surveillance
evo2:
  sentinel_ref: "data/references/2010EL-1786.fasta"
  outbreak_ref: "data/references/Haiti_2022_Resurgence.fasta"
