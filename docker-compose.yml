# Vibrion Sentinel - Docker Compose Stack
# Single-command deployment for cholera surveillance pipeline

services:
  # MongoDB for data storage (GridFS)
  mongodb:
    image: mongo:7.0
    container_name: vibrion-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: vibrion
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vibrion-net

  # Main pipeline runner
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vibrion-pipeline
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./data/raw_reads:/data/input:ro
      - ./data/pipeline_output:/output
      - ./data/global_references:/app/data/global_references:ro
      - ./logs:/app/logs
    environment:
      - VIBRION_MONGO_URI=mongodb://mongodb:27017/vibrion
      - VIBRION_LOG_LEVEL=INFO
      - VIBRION_MODE=fast_triage
    networks:
      - vibrion-net
    command: ["--input", "/data/input", "--output", "/output"]

  # FastAPI backend (optional, for REST API access)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vibrion-api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - VIBRION_MONGO_URI=mongodb://mongodb:27017/vibrion
      - VIBRION_LOG_LEVEL=INFO
    networks:
      - vibrion-net
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    profiles:
      - api  # Only start with: docker-compose --profile api up

# ---------------------------------------------------------------------------
# Phase 1: upload-ingestion service (tus uploads in, pipeline reports out).
# Both services build the `service` stage of the main Dockerfile, i.e. they
# share the pipeline image (full bioinformatics toolchain for the worker).
#
# Required env (see README "Phase 1: upload ingestion"):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY   job state (same project as sentinel_runs)
#   R2_ENDPOINT_URL, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET
#   PIPELINE_REFDIR                            reference bundle for the worker
# Optional: SNAKEMAKE_CORES (default 4), MAX_UPLOAD_BYTES (default 10GB),
#           WORKER_POLL_INTERVAL (default 10s), API_PORT (default 8000).
# ---------------------------------------------------------------------------
  ingest-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: service
    container_name: sentinel-ingest-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - R2_ENDPOINT_URL=${R2_ENDPOINT_URL}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET=${R2_BUCKET}
      - MAX_UPLOAD_BYTES=${MAX_UPLOAD_BYTES:-10000000000}
    networks:
      - vibrion-net
    command: ["uvicorn", "--factory", "service.app.main:asgi_app",
              "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  ingest-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: service
    container_name: sentinel-ingest-worker
    restart: unless-stopped
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - R2_ENDPOINT_URL=${R2_ENDPOINT_URL}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET=${R2_BUCKET}
      - PIPELINE_REFDIR=${PIPELINE_REFDIR}
      - SNAKEMAKE_CORES=${SNAKEMAKE_CORES:-4}
      - WORKER_POLL_INTERVAL=${WORKER_POLL_INTERVAL:-10}
      - WORKER_WORKDIR=/tmp/sentinel-work
      - REPO_DIR=/app
    volumes:
      - sentinel_work:/tmp/sentinel-work
    networks:
      - vibrion-net
    command: ["python", "-m", "service.worker"]

volumes:
  mongodb_data:
    driver: local
  sentinel_work:
    driver: local

networks:
  vibrion-net:
    driver: bridge

