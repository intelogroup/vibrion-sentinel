# Vibrion Sentinel - Conda Environment
# All bioinformatics and Python dependencies

name: vibrion
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # Core Python
  - python=3.11
  - pip>=23.0

  # Bioinformatics tools
  - snakemake>=8.0
  - biopython>=1.81
  - sourmash>=4.8
  - minimap2>=2.26
  - samtools>=1.18
  - bcftools>=1.18
  - fastp>=0.23
  - spades>=3.15
  - seqkit>=2.5
  - kraken2>=2.1

  # Data processing
  - pandas>=2.0
  - numpy>=1.24
  - scipy>=1.11

  # Web framework
  - fastapi>=0.100
  - uvicorn>=0.23
  - httpx>=0.24

  # Database
  - pymongo>=4.5

  # Utilities
  - pyyaml>=6.0
  - click>=8.1
  - rich>=13.0
  - tqdm>=4.66

  # Pip-only packages
  - pip:
      - transformers>=4.35.0
      - torch>=2.0.0
      - accelerate>=0.24.0
