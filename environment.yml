# Vibrion Sentinel - Conda Environment
# All bioinformatics and Python dependencies

name: vibrion
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # Core Python
  - python=3.11
  - pip>=23.0

  # Bioinformatics tools
  - snakemake>=8.0
  - biopython>=1.81
  - sourmash>=4.8
  - minimap2>=2.26
  - samtools>=1.18
  - bcftools>=1.18
  - fastp>=0.23
  - spades>=3.15
  - seqkit>=2.5
  - kraken2>=2.1

  # Phase 0: Nanopore branch (pinned; "latest" is not a version).
  # Medaka models + AMRFinderPlus DB are baked into the Docker image;
  # see the Dockerfile DB stage.
  - nanoplot=1.46.1
  - chopper=0.8.0  # maintained NanoFilt successor
  - flye=2.9.5
  - medaka=2.0.1
  - mlst=2.23.0  # PubMLST V. cholerae scheme
  - amrfinderplus=3.12.8

  # Data processing
  - pandas>=2.0
  - numpy>=1.24
  - scipy>=1.11

  # Web framework
  - fastapi>=0.100
  - uvicorn>=0.23
  - httpx>=0.24

  # Database
  - pymongo>=4.5

  # Utilities
  - pyyaml>=6.0
  - click>=8.1
  - rich>=13.0
  - tqdm>=4.66

  # Pip-only packages
  - pip:
      - transformers>=4.35.0
      - torch>=2.0.0
      - accelerate>=0.24.0
      # vibecheck (cholgen/vibecheck) is not on bioconda; pin the exact commit.
      # Observed 2026-09-23; re-pin deliberately, never float.
      - git+https://github.com/cholgen/vibecheck.git@20f9cd49718328f571abeabc44d09e393a11136e
