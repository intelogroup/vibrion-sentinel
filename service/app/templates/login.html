<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Sentinel — log in</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 4rem auto; max-width: 380px; }
  .ruo { background: #fff3cd; border: 2px solid #b58900; padding: 0.5rem 1rem;
         font-weight: 700; margin-bottom: 1rem; font-size: 0.9rem; }
  input { display: block; width: 100%; margin: 0.5rem 0; padding: 0.5rem;
          box-sizing: border-box; }
  button { padding: 0.5rem 1.5rem; }
  .err { color: #b00020; }
</style></head>
<body>
<div class="ruo">For Research Use Only. Not for use in diagnostic procedures.</div>
<h1>Log in</h1>
<p class="err" id="err"></p>
<form id="f">
  <input name="email" type="email" placeholder="Email" required>
  <input name="password" type="password" placeholder="Password" required>
  <button type="submit">Log in</button>
</form>
<p>No account? <a href="/signup">Sign up</a></p>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const r = await fetch('/auth/login', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({email: fd.get('email'), password: fd.get('password')}),
  });
  if (r.ok) location = '/dashboard';
  else document.getElementById('err').textContent = (await r.json()).detail || 'Login failed';
});
</script>
</body>
</html>
